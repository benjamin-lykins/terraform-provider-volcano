name: Tests

on:
  pull_request:
    paths-ignore:
      - "README.md"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - run: go build -v ./...
      - run: go vet ./...
      - run: gofmt -l .

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - run: go test -v -cover ./...

  generate-docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - run: make docs
      - name: Check for uncommitted docs changes
        run: |
          git diff --exit-code docs/ || \
            (echo "docs/ is out of date. Run 'make docs' and commit the result." && exit 1)
